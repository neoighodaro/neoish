# Deploys this Astro static site. Netlify builds from the repo root and
# publishes the static output in ./dist.
[build]
  command = "pnpm build"
  publish = "dist"

[[plugins]]
package = "netlify-plugin-image-optim"

[[plugins]]
package = "netlify-plugin-minify-html"

[build.environment]
  NODE_VERSION = "22.23.4"

# Markdown content negotiation: an `Accept: text/markdown` request to any page
# is answered with that page's pre-built index.md (see the function and
# scripts/agent-files.mjs). The function returns instantly for every other
# request, so browsers are untouched. Static assets are excluded so the function
# never runs on bundles, media, or the .md variants it would serve.
[[edge_functions]]
  function = "markdown"
  path = "/*"
  excludedPath = ["/_astro/*", "/img/*", "/audio/*", "/vids/*", "/js/*", "/styles/*", "*.md", "*.xml", "*.txt", "*.png", "*.svg", "*.ico"]
