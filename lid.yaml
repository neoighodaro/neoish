# lid sandbox configuration

name: neoish
agent: claude-code
backend: nono
zellij:
  display_name: neoish
runtimes:
  node: "24.16.0"
  pnpm: "12.12.1"
ports:
  - 4321
env:
  ASTRO_TELEMETRY_DISABLED: "1"
env_file: []
scripts:
  on_create: []
  on_start: []
shell:
  aliases:
    clr: "clear"
    g: "git"
network:
  - localhost
  - "*.npmjs.org"
  - "registry.yarnpkg.com"
  - "api.github.com"
  - "docs.astro.build"
  - '*.neoighodaro.com'
  - neoighodaro.com
  - yulo.app
  - '*.yulo.app'
  - medium.com
  - dev.to
  - '*.medium.com'
  - open.spotify.com
  - i.scdn.co
  - '*.spotifycdn.com'
  - music.apple.com
  - itunes.apple.com
  - audio-ssl.itunes.apple.com
  - '*.mzstatic.com'
  - music.youtube.com
paths:
  read:
    - ~/Developer/dotfiles/configs/claude
    - ~/Developer/dotfiles/configs/claude/hooks
    - ~/Developer/dotfiles/configs/claude/skills
  read_file:
    - ~/.npmrc
    - ~/.gitconfig.extended
    - ~/.global-gitignore
    - ~/.config/pnpm/config.yaml
    - ~/Developer/dotfiles/configs/claude/CLAUDE.md
  allow: []
  deny:
    - ~/.bash_history
claude:
  plugins:
    marketplaces:
      - anthropics/claude-plugins-official
      - uppinote20/claude-dashboard
    install:
      - superpowers@claude-plugins-official
      - frontend-design@claude-plugins-official
      - claude-dashboard@claude-dashboard
  settings:
    model: "claude-opus-4-8[1m]"
    tui: default
    feedbackSurveyRate: 0
    attribution:
      commit: ""
      pr: ""
    env:
      CLAUDE_CODE_ENABLE_TELEMETRY: "0"
      CLAUDE_CODE_DISABLE_1M_CONTEXT: "1"

# Instructions injected into the agent's memory file (CLAUDE.md)
# memory: |
#   Project-specific instructions here.
